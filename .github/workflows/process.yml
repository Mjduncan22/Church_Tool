name: Process Ward Directory PDF

on:
  push:
    paths:
      - 'data/*.pdf' # Triggers automatically whenever you add/change a PDF in the data folder

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pymupdf

      - name: Run extraction script
        run: |
          python extract_ward_data.py

      - name: Commit and push generated files back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate JSON and profile images from PDF directory"
          branch: main